name: Build aarch64-musl

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (optional, will read from Cargo.toml if empty)'
        required: false
        type: string
  push:
    branches: [develop, master]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install musl cross toolchain
        run: |
          # Download prebuilt aarch64 musl cross toolchain from musl.cc
          wget -q https://musl.cc/aarch64-linux-musl-cross.tgz
          tar xzf aarch64-linux-musl-cross.tgz
          echo "$PWD/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH
          echo "CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc" >> $GITHUB_ENV
          echo "AR_aarch64_unknown_linux_musl=aarch64-linux-musl-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target aarch64-unknown-linux-musl

      - name: Package
        run: |
          cd target/aarch64-unknown-linux-musl/release
          tar -czvf ../../../rtk-aarch64-unknown-linux-musl.tar.gz rtk
          cd ../../..
          sha256sum rtk-aarch64-unknown-linux-musl.tar.gz > rtk-aarch64-unknown-linux-musl.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtk-aarch64-musl
          path: |
            rtk-aarch64-unknown-linux-musl.tar.gz
            rtk-aarch64-unknown-linux-musl.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            rtk-aarch64-unknown-linux-musl.tar.gz
            rtk-aarch64-unknown-linux-musl.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
